<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163b54"><link rel="manifest" href="manifest.json"><title>ITパスポート学習</title><style>body{font:17px -apple-system,BlinkMacSystemFont,sans-serif;background:#f1f5f8;color:#173044;margin:0}main{max-width:620px;margin:auto;padding:18px}header{background:#163b54;color:white;padding:22px}h1{font-size:23px;margin:0}section{background:white;border-radius:16px;padding:18px;margin:14px 0}button,select{font:inherit;padding:13px;border:1px solid #b9cbd5;border-radius:10px;background:white;color:inherit;margin:5px 0;width:100%;text-align:left}button.primary{background:#176b70;color:white;text-align:center}button:disabled{opacity:.65}small{color:#637788}progress{width:100%;accent-color:#176b70}nav{display:flex;gap:8px}nav button{text-align:center} .good{color:#08794e}.bad{color:#b12d36}@media(prefers-color-scheme:dark){body{background:#101b24;color:#e6edf2}section,button,select{background:#20313d;color:#e6edf2}small{color:#b5c7d1}}</style><header><h1>ITパスポート学習</h1><small style="color:#cce0eb">通勤学習・オフライン試作版</small></header><main><nav><button onclick="home()">ホーム</button><button onclick="stats()">成績</button></nav><div id="app"></div></main><script>
const Q=[
['経営','SWOT分析で外部環境の好ましい要因は？',['強み','弱み','機会','脅威'],2,'機会と脅威は外部環境、強みと弱みは内部環境。'],
['経営','売上1000万円、変動費600万円、固定費200万円の利益は？',['100万円','200万円','400万円','800万円'],1,'売上から変動費と固定費を引く。1000−600−200＝200万円。'],
['経営','顧客との関係を管理する仕組みは？',['CRM','ERP','SCM','CAD'],0,'CRMは顧客関係管理。ERPは経営資源管理、SCMは供給網管理、CADは設計支援。'],
['経営','著作権で保護されるものは？',['単なるアイデア','創作的に表現された文章','自然法則','単なる事実'],1,'著作権は創作的な表現を保護し、アイデアや事実そのものは原則保護しない。'],
['経営','損益分岐点では何が成立する？',['売上＝固定費','利益が最大','売上＝総費用','変動費＝固定費'],2,'売上と総費用が等しく、利益がゼロになる点。'],
['管理','PDCAのCは何を意味する？',['計画','実行','評価','改善'],2,'Checkは実行結果の評価。Plan、Do、Check、Actの順。'],
['管理','WBSの主な目的は？',['暗号化','作業の階層的な分解','顧客情報の管理','通信速度測定'],1,'WBSはプロジェクトの作業を細分化して管理しやすくする。'],
['管理','SLAとは何か？',['サービス品質に関する合意','プログラム言語','記憶装置','販売戦略'],0,'サービス提供者と利用者が品質水準などを合意するもの。'],
['管理','ブラックボックステストで主に確認するものは？',['内部の分岐','ソースコードの書式','入出力の仕様適合性','CPU温度'],2,'内部構造ではなく、入力に対する出力が仕様どおりかを確認する。'],
['技術','フィッシングの典型例は？',['偽サイトで認証情報を盗む','通信を暗号化する','バックアップを作る','OSを更新する'],0,'実在する組織を装って偽サイトなどへ誘導し、情報を盗む。'],
['技術','DNSの役割は？',['画像圧縮','ドメイン名とIPアドレスの対応付け','電源管理','表計算'],1,'DNSは名前解決を行う仕組み。'],
['技術','二要素認証に該当するものは？',['パスワードとPIN','二つのパスワード','パスワードと指紋','二つの秘密の質問'],2,'知識・所持・生体の異なる要素を組み合わせる。'],
['技術','RAMの一般的な特徴は？',['電源を切っても必ず保持','揮発性の主記憶','光学ディスク','通信規格'],1,'一般的な主記憶RAMは電源を切ると内容を失う。'],
['技術','SQLのSELECT文の主な用途は？',['データ検索','電源停止','暗号鍵生成','画像描画'],0,'SELECTはデータベースからデータを取得する。'],
['技術','ランサムウェアの典型的な行為は？',['広告表示のみ','ファイルを暗号化し金銭を要求','通信速度改善','データ圧縮'],1,'データを利用不能にするなどして身代金を要求する。']];
let logs=[];try{logs=JSON.parse(localStorage.getItem('itp_logs')||'[]')}catch(e){}let queue=[],pos=0,start=0,chosen=-1,answered=false;const app=document.getElementById('app');function save(){try{localStorage.setItem('itp_logs',JSON.stringify(logs))}catch(e){alert('保存できません。成績画面からバックアップしてください。')}}function home(){app.innerHTML=`<section><h2>今日の学習</h2><p>オリジナル問題 ${Q.length}問＋公式過去問200問</p><button class="primary" onclick="location.href='./past.html'">公式過去問（令和7・8年度）</button><button class="primary" onclick="begin('all')">ランダム演習</button><button onclick="begin('weak')">苦手問題を復習</button>${['経営','管理','技術'].map(x=>`<button onclick="begin('${x}')">${x}分野</button>`).join('')}</section><section><small>公式過去問は冊子画像で収録。初回のオンライン読み込み後、オフライン利用可能な構成です。</small></section>`}function begin(mode){queue=Q.map((q,i)=>i).filter(i=>mode==='all'||(mode==='weak'?(()=>{let l=logs.filter(x=>x.id===i).at(-1);return l&&(!l.ok||l.conf<3)})():Q[i][0]===mode)).sort(()=>Math.random()-.5);pos=0;if(!queue.length){alert('復習対象がありません');return}show()}function show(){if(pos>=queue.length){stats();return}let q=Q[queue[pos]];chosen=-1;answered=false;start=Date.now();app.innerHTML=`<section><small>${q[0]} ・ ${pos+1}/${queue.length}</small><progress value="${pos}" max="${queue.length}"></progress><h2>${q[1]}</h2>${q[2].map((x,i)=>`<button id="o${i}" onclick="pick(${i})">${'アイウエ'[i]}．${x}</button>`).join('')}<p>自信度</p><select id="conf"><option value="3">理解している</option><option value="2" selected>なんとなく分かる</option><option value="1">勘で選んだ</option></select><button id="submit" class="primary" disabled onclick="grade()">解答する</button><div id="feedback"></div></section>`}function pick(i){if(answered)return;chosen=i;Q[queue[pos]][2].forEach((_,j)=>document.getElementById('o'+j).style.borderColor=i===j?'#149b91':'');document.getElementById('submit').disabled=false}function grade(){if(answered||chosen<0)return;answered=true;let id=queue[pos],q=Q[id],ok=chosen===q[3];logs.push({id,ok,conf:Number(document.getElementById('conf').value),seconds:Math.round((Date.now()-start)/1000),date:new Date().toISOString()});save();document.getElementById('submit').disabled=true;document.getElementById('conf').disabled=true;document.getElementById('feedback').innerHTML=`<h3 class="${ok?'good':'bad'}">${ok?'正解':'不正解'}：${q[2][q[3]]}</h3><p>${q[4]}</p><button class="primary" onclick="pos++;show()">次へ</button>`}function stats(){let rate=a=>a.length?Math.round(a.filter(x=>x.ok).length/a.length*100)+'%':'未演習';app.innerHTML=`<section><h2>学習成績</h2><p>累計 ${logs.length} 回 / 正答率 ${rate(logs)}</p>${['経営','管理','技術'].map(x=>`<p>${x}：${rate(logs.filter(l=>Q[l.id][0]===x))}</p>`).join('')}<p>自信を持って正解：${logs.filter(x=>x.ok&&x.conf===3).length}回</p><button onclick="backup()">履歴をJSONで保存</button><label>履歴を復元<input type="file" accept=".json" onchange="restore(this)"></label></section>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(logs)],{type:'application/json'}));a.download='itpassport-history.json';a.click()}async function restore(el){try{let d=JSON.parse(await el.files[0].text());if(!Array.isArray(d)||!d.every(x=>Number.isInteger(x.id)&&Q[x.id]&&typeof x.ok==='boolean'&&[1,2,3].includes(x.conf)))throw Error();if(confirm('現在の履歴を置き換えますか？')){logs=d;save();stats()}}catch(e){alert('履歴ファイルが不正です')}}home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
